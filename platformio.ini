; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
extra_scripts = pre:scripts/load_wifi_secret.py

upload_port = COM7
monitor_port = COM7
monitor_speed = 115200

board_upload.flash_size = 4MB
board_build.partitions = bike_computer_4mb.csv

lib_deps =
    lovyan03/LovyanGFX@^1.2.30
    lvgl/lvgl@^9.6.0

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; Use ESP-IDF malloc instead of reserving LVGL's private 64 KiB pool.
    ; Unused UI memory can then serve the map cache and BLE allocations.
    -DLV_USE_STDLIB_MALLOC=1
    ; Decode cached I4 map fragments one row at a time from RAM. Keep this off:
    ; enabling RAM_LOAD expands indexed images to full ARGB8888 buffers.
    -DLV_BIN_DECODER_RAM_LOAD=0
    -DLV_USE_FS_STDIO=1
    -DLV_FS_STDIO_LETTER=83
    -DLV_FS_STDIO_CACHE_SIZE=4096
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_48=1
    -Iinclude
    -Icomponents/map_tiles/include
